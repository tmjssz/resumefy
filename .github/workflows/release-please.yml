name: Release Please

on:
  # Both triggers are needed. The action does two different jobs depending on state: open or
  # refresh the release PR when there are unreleased commits, or convert an already-merged release
  # PR into a tag and a Release. With only workflow_dispatch every release would take two clicks;
  # the push trigger covers the second job. Merging the release PR remains the manual act that
  # decides when to release.
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Never cancel in progress: a half-run that created a tag but not the Release leaves state the
  # next run has to reconcile. Serialise instead.
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Largely defence in depth: release-please-action uses the App token below explicitly and never
    # falls back to github.token, so this block constrains only the unused default GITHUB_TOKEN.
    # It is the token step's permission-* inputs that actually govern what release-please may do.
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Not secrets.GITHUB_TOKEN: events created with it do not start new workflow runs, so its tag
      # would never fire release.yml and its release PR would get no CI run — leaving the ci-ok
      # required check unreported and the PR unmergeable. An App installation token is scoped to
      # this repo and expires in an hour, unlike a PAT.
      - name: Mint a GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # Not app-id: v3 deprecated that input in favour of client-id. The Client ID is a
          # different value from the numeric App ID — copy it from the App's settings page.
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # Without these the token inherits every permission the App installation holds. Down-scope
          # to the three release-please actually calls: contents for the release branch, tag and
          # Release, pull-requests for the release PR, and issues because it labels that PR
          # `autorelease: pending` and GitHub's label endpoints live under the Issues API.
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      # No actions/checkout: release-please operates entirely through the GitHub API, reading
      # commits and writing the release branch remotely. A checkout here would be dead weight.
      - name: Release please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Publishing is release.yml's job, triggered by the tag this created. This step only makes the
      # handoff visible in the run log, so a release that stalls can be diagnosed from one place.
      - name: Report the outcome
        env:
          RELEASES_CREATED: ${{ steps.release.outputs.releases_created }}
          PRS_CREATED: ${{ steps.release.outputs.prs_created }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: |
          if [ "$RELEASES_CREATED" = "true" ]; then
            echo "::notice::released $TAG_NAME — release.yml now publishes it"
          elif [ "$PRS_CREATED" = "true" ]; then
            echo "::notice::release PR opened or refreshed; merge it to release"
          else
            # prs_created is "created or updated", so it is also false when an open release PR
            # already matches main. Do not claim there is nothing to release — check the PR list.
            echo "::notice::no release action taken: either no releasable commits since the last release, or the open release PR is already up to date"
          fi
