name: Setup
description: Install Node from .node-version, restore the yarn cache, and install dependencies.

inputs:
  node-version:
    description: Overrides the version pinned in .node-version. Empty uses the pin.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        # When both are provided, node-version wins and node-version-file is ignored; an empty
        # string counts as not provided, which is what makes the matrix override work.
        node-version: ${{ inputs.node-version }}
        node-version-file: .node-version
        cache: yarn
        # Deliberately no registry-url, which the workflows this replaces all set. Nothing in CI
        # authenticates to npm any more — release.yml publishes with the npm CLI over OIDC — and
        # setup-node v7 removed the dummy NODE_AUTH_TOKEN fallback, so setting registry-url without
        # a token now risks writing a broken .npmrc for no benefit.

    # Fail loudly here rather than several steps later with a confusing error, and leave the
    # resolved versions in the log so a matrix run can be checked at a glance.
    - name: Report the resolved toolchain
      shell: bash
      env:
        NODE_VERSION: ${{ inputs.node-version }}
      run: |
        echo "node $(node --version) / yarn $(yarn --version)"
        if [ -n "$NODE_VERSION" ]; then
          major="$(node -p 'process.versions.node.split(".")[0]')"
          if [ "$major" != "$NODE_VERSION" ]; then
            echo "::error::asked for node $NODE_VERSION but got $major"
            exit 1
          fi
        fi

    - shell: bash
      run: yarn install --immutable --check-cache
